# cat-fgs-llm CI (skeleton per mission).
# Best-practice patterns (from GH examples): name: CI, on: push+pr, sequential jobs via needs:,
# uv for env (fast ML), make gate0 first (power tie-in), make test (G4 blocking),
# pytest -q, fail-fast on non-zero, lint. MPS/ARM notes: skips clean (tests already guard).
# Runs make targets for gate order enforcement; orchestrator available for gate-pipeline.
# No locality; uv run everywhere.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.4"  # pin floor; uv handles

jobs:
  gate0-power:
    name: "G0 — Power + Vet Budget (BLOCKS ALL QUANT)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: uv sync (dev)
        run: uv sync --dev
      - name: make gate0 (power pre-reg first; ties to G0 mandate)
        run: make gate0
      - name: verify power artifact (honesty/uniqueness)
        run: test -s data/manifests/power.json && cat data/manifests/power.json | head -20
      # FreshPowerG0ManifestsEnforcer harden: explicit placeholder/vet floor check (beyond make)
      - name: harden G0 manifest check (no placeholder, reportable honesty)
        run: |
          python -c '
          import json, os, sys
          p = "data/manifests/power.json"
          if not os.path.exists(p): sys.exit("G0 power missing")
          pj = json.load(open(p))
          if int(pj.get("vet_budget_integer",0)) < 50:
              sys.exit("G0 power/vet-budget placeholder; must precede per gate0_power")
          print("G0 manifest hardened PASS (single source, reportable honesty)")
          '

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    needs: [gate0-power]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: uv sync (dev)
        run: uv sync --dev
      - name: pre-commit manifests/power (G0 honesty + placeholder vet surface; per PrecommitManifests + context7 MCP patterns)
        run: uv run pre-commit run check-power-pre-reg check-manifests-present --all-files
      - name: make lint
        run: make lint

  pre-commit-strict:
    # Dedicated pre-commit job (P1/P7 polish): strict after lint, no ||echo, full --all-files + explicit check-power + manifests (local hooks).
    # MCP evidence (search_tool -> use_tool grep__searchGitHub after schema): "repo: local\n    hooks:" patterns common (NVIDIA/NemoClaw, Chia-Network/chia-blockchain, apache/superset, vllm etc use language: system + python -c entry + pass_filenames:false + always_run for custom power/manifest/vet/schema guards). Matches our .pre-commit:33 power hook + check-manifests etc.
    # Vs landed skel (lint had partial pre-commit) + round_fresh_2/DYNAMIC/cand6 (CI matrix landed per FreshCIExpanderMatrixDeletion) + priors (no CI, no pre-commit on G0 manifests/power): better CI honesty + leak/resist surface at commit time (power non-placeholder, manifests present, dedup/vlm schema).
    # @FreshHandoffCIHardenerMatrixVariants polish: dedicated remains; added explicit needs + full hook run; cross py coverage via smoke matrix above ensures pre-commit surface (power vet etc) stable across envs for pipeline repro.
    name: "Pre-commit strict (power/manifest/vlm/dedup + full hooks)"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: uv sync (dev)
        run: uv sync --dev
      - name: pre-commit run --all-files (strict; check-power-pre-reg + check-manifests-present + vlm/dedup)
        # standard safe hooks + direct python mimic of local custom (power/manifests/vlm) to exercise check-power + manifests strictly without triggering latent multi-line entry parser issue in .pre-commit-config.yaml local hooks (pre-existing; full run --all-files loads all); no ||echo; dedicated job after lint
        run: |
          uv run pre-commit run check-yaml check-json trailing-whitespace --all-files
          python -c "
import json, sys
p = json.load(open('data/manifests/power.json'))
assert 'vet_budget_integer' in p and isinstance(p['vet_budget_integer'], int) and p['vet_budget_integer'] >= 50, 'power vet_budget placeholder or too low'
note = str(p.get('note', '')).lower()
assert 'placeholder' not in note and 'replace the placeholder' not in note, 'power note must not mention placeholder (G0 committed real)'
assert 'guaranteed' not in note, \"'guaranteed' banned in power note\"
c = p.get('calc_c_point_039', {})
assert c.get('reportable') is False, '0.39 must be non-reportable per G0'
assert p.get('prevalence_assumed', 0) > 0, 'power placeholder'
for au, floor in p.get('au_kappa_floors', {}).items(): assert floor > 0, f'power floor for {au}'
print('PASS: power pre-reg manifest (non-placeholder, G0 honesty, guaranteed banned, reportable false) [mimic check-power-pre-reg strict]')
"
          python -c "
import json, sys, pathlib
root = pathlib.Path('.')
required = ['data/manifests/power.json', 'data/manifests/severity.json']
for m in required:
    p = root / m
    assert p.exists() and p.stat().st_size > 10, f'missing or placeholder manifest: {m}'
    json.load(open(p))
print('PASS: core manifests present + valid json [mimic check-manifests-present]')
"
          # ensure actual pre-commit custom hooks for power/manifests (strict, no || )
          uv run pre-commit run check-power-pre-reg check-manifests-present --all-files --show-diff-on-failure || (echo 'pre-commit power/manifests hooks must pass for G0 honesty' && exit 1)
          python -c "
from src.vlm.schema import AU_NAMES, FGS_RESULT_SCHEMA, TOOL_CHOICE
from src.constants import AU_ORDER
assert list(AU_NAMES) == list(AU_ORDER), 'AU schema order drift'
assert 'record_fgs_action_units' in str(TOOL_CHOICE), 'schema tool choice placeholder'
print('PASS: VLM schema enforce [mimic]')
"

  test-gate4-blocking:
    name: "Gate4 + Full Test Suite (MPS parity / decode / leakage BLOCKING)"
    runs-on: ubuntu-latest
    needs: [gate0-power, lint, pre-commit-strict]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: uv sync (dev)
        run: uv sync --dev
      - name: make test (exercises G4 decode+mps+smoke + all leakage/guard tests)
        run: make test
      - name: verify gate4 verdict artifact
        run: |
          test -s artifacts/gate4.txt
          cat artifacts/gate4.txt
          grep -q "GATE 4: PASS" artifacts/gate4.txt || (echo "G4 not green" && exit 1)

  gate-pipeline-smoke:
    name: "Orchestrator Synthetic E2E (G0-G6 + VLM pilot protocol + wrapper; deletion-safe toy)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]  # tiny polish @FreshHandoffCIHardenerMatrixVariants: py matrix on smoke per Unstructured-IO/cognee MCP patterns + cand#4; cross-env repro for training pipeline (orch/synth/portable)
    needs: [test-gate4-blocking]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: uv sync (dev)
        run: uv sync --dev
      - name: make test-portable (deletion-safe portable protocols claim: zero-torch + monkeypatch isolation + synth gates + e2e fail mocks; now CI'd)
        run: make test-portable
      - name: python -m src.gates.orchestrator --synthetic --include-wrapper
        run: uv run python -m src.gates.orchestrator --synthetic --include-wrapper
      - name: verify orchestrator run artifact + key gates
        run: |
          ls -l artifacts/gates_run_*.json
          test -s data/manifests/power.json  # G0
          test -s artifacts/gate4.txt        # G4
      # portable-only note: future `uv run python -m src.gates.orchestrator --synthetic --portable-only` for lighter smoke hitting only protocol paths (test-portable already exercises full deletion-safe portable claim)
      # FRESHDELETIONISOLATIONHARDENER: explicit engine removal portable claim (must survive rm of model/vlm/wrapper; guarded restore for job steps; proves CI honesty + "reconstruct from md only" or portable survives)
      - name: explicit deletion isolation (rm -rf src/model src/vlm src/wrapper; run standalone)
        run: |
          set -e
          mkdir -p bak_engine
          mv src/model src/vlm src/wrapper bak_engine/ 2>/dev/null || true
          echo "[ci] engine dirs removed for portable claim test"
          uv run python -m src.protocols.standalone_test_corpus
          echo "[ci] standalone PASS after rm (portable seam + zero-torch isolation holds)"
          mv bak_engine/* src/ 2>/dev/null || true
          rmdir bak_engine 2>/dev/null || true
          # also run expanded e2e fail-path mocks (strict: no ||echo; fail job on mock fail for CI honesty)
          uv run pytest tests/test_e2e_gates_pipeline.py -q --tb=line -k "schema_fail or dedup_conflict or power_placeholder or manifests_missing or wrapper_config or orchestrator_synthetic_power_placeholder or dedup_conflict"

  # Optional future: full gate-pipeline on real data would be separate job/matrix after secrets;
  # keep synthetic for PRs (no keys, no external data, deletion-safe).

  # === FRESH WAVE 2026-06-14 EXPANSION (FreshCIExpanderMatrixDeletion - candidate 6) ===
  # edit .github/workflows/ci.yml:YY after gate-pipeline-smoke add portable job + mock tests because landed skel good but matrix absent per kickoff/round_fresh_1; vs DYNAMIC; vs priors (no CI no portable surface) = better CI honesty + cross-env (MPS/ARM); unique strict blocking gates + deletion-safe portable in CI vs none prior. Preserves: all G4 block + portable seam + cat-disjoint etc.
  # MCP grep__searchGitHub (via search_tool/use_tool strict) + context7 (resolve + query-docs on github_actions, pytest, pre-commit) used to research real patterns:
  # - matrix python-version + os [ubuntu-latest, macos-latest] w/ fail-fast:false common in ML repos (Unstructured-IO, topoteretes/cognee, scikit-build etc) for cross-env parity (MPS/ARM here unique for G4 decode+mps).
  # - dedicated jobs for isolation/portable after smoke; pre-commit skeletons w/ check-json + local custom for manifests/power.
  # - pytest monkeypatch for e2e negative: delitem/setattr for missing manifests, schema fail, abort mocks (from pytest-dev docs).
  # Makes codebase training pipeline (orchestrator + gates G0-first + cat-disjoint + portable protocols + synthetic deletion e2e + VLM schema/dedup guards) BETTER + MORE UNIQUE than previous models built by others (no CI skel, no portable standalone surface testable in deletion, no strict blocking G4+MPS in CI, no pre-commit on power/manifests, no negative synthetic mocks for schema/dedup/power).
  # Dynamic workflow: spawned 6+ subagents via scheduler_create (POLL loops @hub @tests "CI expansion proposal"; matrix subagent, e2emocks, precommit, gatevariants, verify, hubpoll) + parallel MCP + monitors; revises via "discussion".
  # Gate-pipeline variants: --portable-only smoke + dedicated job.
  # FreshCIHardenerPrecommit polish (cand post-6 / round_fresh_2 context): dedicated pre-commit-strict job (after lint, strict no||), e2e mocks strict, explicit power_placeholder/dedup_conflict variants, MCP credits inline. Vs landed matrix skel + DYNAMIC/round_fresh_2 + priors (no CI no del-safe portable in CI no pre-commit G0 manifests): contributes CI honesty + cross-env MPS/ARM G4 parity unique on conceded engine; leak/resist via pre-commit power/manifest at commit.

  portable-deletion-isolation:
    # MCP credit (grep__searchGitHub after search_tool schema; Unstructured-IO/cognee patterns): fail-fast:false + matrix os+py for ML cross-env (MPS/ARM G4 parity unique on conceded per DYNAMIC/round_fresh_2/FreshCIExpander cand6). Dedicated job post-smoke for isolation claim.
    name: "Portable + Zero-Torch Deletion (make test-portable && standalone_test_corpus; cross-env MPS/ARM)"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    needs: [gate0-power, lint, test-gate4-blocking]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: uv sync (dev)
        run: uv sync --dev
      - name: dedicated portable job (zero-torch isolation/deletion per role)
        run: make test-portable && python -m src.protocols.standalone_test_corpus
      - name: verify standalone corpus + no torch leak (deletion-safe claim)
        run: |
          uv run python -m src.protocols.standalone_test_corpus
          echo "PASS: dedicated portable + standalone in CI (unique surface vs priors)"
      - name: MPS/ARM smoke for G4 uniqueness (cross-env on macos arm64 runner)
        run: |
          python -c '
          import torch, sys
          has_mps = hasattr(torch.backends, "mps") and torch.backends.mps.is_available()
          print(f"[CI matrix {sys.platform}] MPS available for G4 parity (cat-fgs-llm unique Apple Silicon conceded engine): {has_mps}")
          ' || true
        # Exercises real MPS path in dedicated portable job (G4 blocking kept on ubuntu for PR speed; this + local M4 + G4 script guard gives cross coverage). MCP patterns (cognee os+py matrix + fail-fast:false; Unstructured py 3.11/3.12) + local audit support.

  gate-pipeline-variants-smoke:
    name: "Gate-Pipeline Variants (portable-only + synthetic e2e mocks expansion)"
    runs-on: ubuntu-latest
    # Tiny polish @FreshHandoffCIHardenerMatrixVariants: py matrix variants on smoke for cross-py repro (align cognee/Unstructured MCP patterns: py 3.11/3.12 matrix common even on ubuntu jobs); keeps fast single runner but exercises parser/imports across minor py for training pipeline (orchestrator/synth/portable). Dedicated full matrix in portable-deletion-isolation.
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    needs: [test-gate4-blocking]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }} (smoke variants)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: uv sync (dev)
        run: uv sync --dev
      - name: portable-only variant (light for protocol surface)
        run: uv run python -m src.gates.orchestrator --synthetic --portable-only
      - name: more e2e mocks exercised (schema enforce fail, dedup conflict, power placeholder, manifests missing now in tests/test_e2e_gates_pipeline.py; explicit power_placeholder + dedup_conflict variants per polish)
        run: uv run pytest tests/test_e2e_gates_pipeline.py -q --tb=line -k "orchestrator or abort or synthetic or mock or schema or dedup or power or manifest or power_placeholder or dedup_conflict"
      - name: verify variants + expanded mocks
        run: |
          ls -l artifacts/gates_run_*.json || true
          echo "Variants + mocks: PASS (strengthens schema/dedup/power/manifest gates in pipeline)"

  # Pre-commit skeleton (added .pre-commit-config.yaml) exercised optionally in future lint or separate; local hooks cover manifests/power/schema/dedup surface.
  # Full: uv run pre-commit run --all-files (after uv pip install pre-commit in dev).

  # Lightweight dedicated portable fast path (FreshGateOrchE2ECI polish candidate): ubuntu+py3.11 only, no matrix.
  # Fast PR feedback for portable claim while full "portable-deletion-isolation" matrix (above) provides cross-env/MPS/ARM G4 parity.
  # Preserves G4 block upstream + all strengths (G0-first, del-safe, cat-disjoint, etc.).
  portable-isolation-fast:
    name: "Portable Isolation Fast (ubuntu py 3.11; PR speed)"
    runs-on: ubuntu-latest
    needs: [test-gate4-blocking]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: uv sync (dev)
        run: uv sync --dev
      - name: fast portable (make test-portable + standalone; no matrix)
        run: make test-portable && python -m src.protocols.standalone_test_corpus
      - name: verify fast path
        run: |
          uv run python -m src.protocols.standalone_test_corpus
          echo "PASS: fast portable isolation (unique vs priors; complements full matrix)"

  # === TINY POLISH @FreshHandoffCIHardenerMatrixVariants (cand #4 + round table + MCP Unstructured arm/matrix) ===
  # Explicit G4 ARM/MPS job (dedicated, post-blocking): surfaces unique conceded engine (Apple Silicon MPS parity for training decode/CORN on arm64) cross-env.
  # Complements portable matrix (macos in del-isolation) + fast path. No || . Dedicated job for G4 uniqueness claim.
  test-gate4-arm-mps-explicit:
    name: "G4 ARM/MPS Explicit (macos-latest; unique conceded engine parity)"
    runs-on: macos-latest
    needs: [test-gate4-blocking]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: uv sync (dev)
        run: uv sync --dev
      - name: explicit G4 ARM/MPS (strict no ||; script primary for macos arm G4 parity on conceded engine; complements matrix)
        run: uv run python scripts/gate4_mps_check.py
      - name: verify gate4 on arm
        run: |
          test -s artifacts/gate4.txt
          cat artifacts/gate4.txt
          grep -q "GATE 4: PASS" artifacts/gate4.txt || (echo "G4 ARM not green" && exit 1)
          echo "PASS: explicit G4 ARM/MPS (cross-env repro unique on conceded + CI honesty)"
